[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sailang"
version = "1.0.0"
description = "SaiLang: a beginner-friendly, English-like programming language"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sai = "sailang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
